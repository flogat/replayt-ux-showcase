[project]
name = "replayt-ux-showcase"
version = "0.2.0"
description = "Polished demos and UI patterns for replayt integrators with design-engineering handoff playbook: Python project using replayt; see docs for scope."
requires-python = ">=3.11"
dependencies = [
    "replayt>=0.1.0,<0.5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "pip-audit>=2.7.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = [
  "--cov=replayt_ux_showcase.demo",
  "--cov-fail-under=80",
  "--cov-report=term-missing:skip-covered",
]
