[project]
name = "replayt-ux-showcase"
version = "0.2.0"
description = "Polished demos and UI patterns for replayt integrators with design-engineering handoff playbook: Python project using replayt; see docs for scope."
requires-python = ">=3.11"
dependencies = [
    "replayt>=0.1.0,<0.5.0",
]

[project.optional-dependencies]
dev = [
  "pip-audit>=2.7.0",
  "playwright>=1.48.0",
  "pytest>=8.0",
  "pytest-cov>=5.0.0",
<<<<<<< HEAD
  "pytest-playwright>=0.5.0,<0.7.0",
=======
  "pytest-playwright>=0.5.0",
>>>>>>> origin/mc/backlog-ef4adea7
  "ruff>=0.6.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--cov=replayt_ux_showcase.demo",
  "--cov-fail-under=80",
  "--cov-report=term-missing:skip-covered",
  "-m",
  "not playwright",
]
markers = [
  "playwright: Chromium load smoke for shipped docs/examples/*.html (see README; CI job examples-playwright-smoke)",
]
markers = [
  "browser_smoke: Playwright smoke for docs/examples (isolated from default pytest-cov addopts; see README).",
]
