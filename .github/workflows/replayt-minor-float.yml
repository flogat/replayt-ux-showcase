# Optional: latest replayt patch on one minor line (0.2.x). Not part of the default PR gate.
# See docs/compat.md — EX-REPLAYT-MINOR-FLOAT, docs/DESIGN_PRINCIPLES.md — Optional replayt minor-line float CI job.

name: Replayt minor-line float smoke

permissions:
  contents: read

on:
  schedule:
    # Weekly Monday 06:00 UTC — adjust cadence via maintainer PR if needed.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  replayt-minor-float-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Validate pyproject.toml syntax
        run: python -c "import pathlib, tomllib; tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))"
      - name: Install package and dev deps (replayt 0.2.x float)
        run: |
          python -m pip install --upgrade pip
          printf 'replayt>=0.2.0,<0.3.0\n' > '${{ runner.temp }}/replayt-float-constraint.txt'
          pip install -e ".[dev]" -c '${{ runner.temp }}/replayt-float-constraint.txt'
      - name: Assert replayt resolved version is in 0.2.x
        run: |
          python -c "import replayt; from packaging.version import Version as V; v=V(replayt.__version__); assert V('0.2.0')<=v<V('0.3.0'), replayt.__version__"
      - name: Import smoke (replayt + showcase)
        run: python -c "import replayt; import replayt_ux_showcase"
      - name: Console demo subprocess smoke
        run: |
          python <<'PY'
          import subprocess
          import sys

          r = subprocess.run(
              [sys.executable, "-m", "replayt_ux_showcase.demo"],
              capture_output=True,
              text=True,
          )
          assert r.returncode == 0, r.stderr
          out = r.stdout + r.stderr
          for needle in ("[replayt-demo]", "Rendering demo timeline", "Overlay teaching"):
              assert needle in out, f"missing {needle!r} in demo output"
          PY
