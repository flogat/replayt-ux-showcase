name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - master
      # Mission Control backlog workflows push mc/backlog-* before CI poll
      - "mc/**"
  pull_request:
    branches:
      - master
      - "mc/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        # PEP 508 range is replayt>=0.1.0,<0.5.0 — pin one release per exercised minor line (see docs/compat.md).
        replayt-version: ["0.1.0", "0.2.0", "0.4.25"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Validate pyproject.toml syntax
        run: python -c "import pathlib, tomllib; tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))"
      - name: Install package and dev deps
        run: |
          python -m pip install --upgrade pip
          printf 'replayt==%s\n' '${{ matrix.replayt-version }}' > '${{ runner.temp }}/replayt-constraint.txt'
          pip install -e ".[dev]" -c '${{ runner.temp }}/replayt-constraint.txt'
      - name: Confirm replayt pin resolved
        run: python -c "import replayt; assert replayt.__version__ == '${{ matrix.replayt-version }}', replayt.__version__"
      - name: Run Ruff linter
        run: ruff check .
      - name: Check Ruff formatting
        run: ruff format --check .
      - name: Run tests
        run: python -m pytest tests --ignore=tests/docs_examples_playwright -q --tb=short

  docs-examples-playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run docs/examples Playwright smoke
        run: python -m pytest tests/docs_examples_playwright -q --tb=short --no-cov --browser chromium

  examples-playwright-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Validate pyproject.toml syntax
        run: python -c "import pathlib, tomllib; tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))"
      - name: Install package and dev deps
        run: |
          python -m pip install --upgrade pip
          printf 'replayt==0.4.25\n' > '${{ runner.temp }}/replayt-constraint.txt'
          pip install -e ".[dev]" -c '${{ runner.temp }}/replayt-constraint.txt'
      - name: Confirm replayt pin resolved
        run: python -c "import replayt; assert replayt.__version__ == '0.4.25', replayt.__version__"
      - name: Install Playwright Chromium
        run: python -m playwright install chromium --with-deps
      - name: Run static HTML Playwright smoke
        run: |
          python -m pytest tests/playwright -q --tb=short \
            --override-ini="addopts=" \
            --no-cov \
            --browser chromium

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Validate pyproject.toml syntax
        run: python -c "import pathlib, tomllib; tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))"
      - name: Install package and dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # PyPA pip-audit has no --severity-high; --ignore-vuln only for CVEs in docs/DEPENDENCY_AUDIT.md
      - name: Run supply-chain audit
        run: pip-audit --ignore-vuln CVE-2026-4539 --desc
